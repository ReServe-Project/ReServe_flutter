name: reserve_mobile
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  google_fonts: ^6.2.1
  provider: ^6.1.5+1
  pbp_django_auth: ^0.4.0
  http: ^1.2.2
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - img/
    - assets/images/bg_gym.jpg
    - assets/images/bg_welcome.jpg
    - assets/images/R_logo.png
    - assets/images/empty.png
    - assets/images/logo_reserve.png
    - assets/images/default_avatar.png

